[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-job-discovery"
version = "0.1.0"
description = "Fetch, filter and score job postings from the public JSON APIs of six applicant tracking systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Trevor Moore", email = "mtrevor380@gmail.com" }]
keywords = ["jobs", "ats", "greenhouse", "lever", "ashby", "workable", "recruitee", "smartrecruiters"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
ats-discovery = "ats_discovery.cli:main"

[tool.setuptools]
packages = ["ats_discovery"]

[tool.setuptools.package-data]
ats_discovery = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
